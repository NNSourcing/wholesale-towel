<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you | BlueLoom Towels</title>
<style>
:root{--bg:#ffffff;--surface:#f3f8ff;--line:#dbe7f7;--text:#12233d;--muted:#5b6b82;--blue:#1f6fe5;--blue-dark:#154fb0;--on-blue:#ffffff}
@media (prefers-color-scheme: dark){:root{--bg:#0e1726;--surface:#15213a;--line:#25365a;--text:#e8efff;--muted:#9db0cf;--blue:#4b8dff;--blue-dark:#7aa9ff;--on-blue:#0b1426}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter","Helvetica Neue",Arial,sans-serif;line-height:1.6}
header{border-bottom:1px solid var(--line)}
.nav{max-width:1100px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center}
.logo{font-weight:700;font-size:18px;color:var(--blue);text-decoration:none}
main{max-width:560px;margin:0 auto;padding:72px 20px;text-align:center}
.ok{width:64px;height:64px;border-radius:50%;background:var(--surface);border:2px solid var(--blue);color:var(--blue);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
h1{margin:0 0 10px;font-size:30px}
p{color:var(--muted);margin:0 0 26px}
.btn{display:inline-block;background:var(--blue);color:var(--on-blue);padding:12px 24px;border-radius:8px;font-weight:600;text-decoration:none;margin:0 4px 8px}
.btn:hover{background:var(--blue-dark)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
</style>
</head>
<body>
<header><div class="nav"><a class="logo" href="index.html">BlueLoom Towels</a></div></header>
<main>
  <div class="ok">✓</div>
  <h1>Thank you for your inquiry</h1>
  <p>We have received your request and will reply by email, usually within 1 business day.</p>
  <a class="btn" href="index.html#products">Back to products</a>
  <a class="btn ghost" href="index.html">Home</a>
</main>
</body>
</html>
